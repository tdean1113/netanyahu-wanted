name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  REGION: australia-southeast1
  SERVICE: mam-medal-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        working-directory: api
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --allow-unauthenticated \
            --set-env-vars "^|^SQUARE_ENVIRONMENT=production|MOCK_SQUARE=0|FRONTEND_BASE_URL=https://netanyahuwanted.com|CORS_ORIGINS=https://netanyahuwanted.com,https://www.netanyahuwanted.com,https://tdean1113.github.io,http://localhost:5173" \
            --set-secrets "SQUARE_ACCESS_TOKEN=SQUARE_ACCESS_TOKEN:latest,SQUARE_LOCATION_ID=SQUARE_LOCATION_ID:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,ADMIN_TOKEN_SECRET=ADMIN_TOKEN_SECRET:latest,SQUARE_MEDAL_VARIATION_ID=SQUARE_MEDAL_VARIATION_ID:latest,SQUARE_DONATION_APAN_VARIATION_ID=SQUARE_DONATION_APAN_VARIATION_ID:latest,SQUARE_DONATION_ACIJ_VARIATION_ID=SQUARE_DONATION_ACIJ_VARIATION_ID:latest,SQUARE_DONATION_OLIVE_KIDS_VARIATION_ID=SQUARE_DONATION_OLIVE_KIDS_VARIATION_ID:latest,SQUARE_DONATION_PARA_VARIATION_ID=SQUARE_DONATION_PARA_VARIATION_ID:latest,SQUARE_DONATION_PANZMA_VARIATION_ID=SQUARE_DONATION_PANZMA_VARIATION_ID:latest"
